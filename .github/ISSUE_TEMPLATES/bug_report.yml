name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        1. Initialize: `./.agency/bin/agency init --mode <mode>`
        2. Run: `...`
        3. See error
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Agency Platform are you using?
      placeholder: e.g., 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using?
      placeholder: e.g., 22.x.x
    validations:
      required: true
  - type: dropdown
    id: tracker
    attributes:
      label: Tracker Mode
      description: Which tracker mode are you using?
      options:
        - atlassian
        - github
        - linear
        - standalone
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include any relevant error messages or logs.
      render: shell
    validations:
      required: false
