name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Unit + Simulated E2E
        run: npm test
      - name: Prompt Lint
        run: npm run lint:prompts
      - name: Doctor (Offline)
        run: npm run doctor

